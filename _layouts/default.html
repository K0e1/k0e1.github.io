<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>{{ page.title }} | {{ site.title }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ "/assets/css/cyber.css" | relative_url }}?v=6">
</head>
<body>
  <div id="particles-js"></div>

 <nav style="margin-bottom: 2rem; padding: 1rem 1.5rem; background: var(--nav-bg); border-radius: 8px; display: flex; justify-content: space-between; align-items: center;">
    <div style="display: flex; gap: 2.5rem; align-items: center;">
        <a href="{{ "/" | relative_url }}" style="font-weight: 600;">主页</a>
        <a href="{{ "/category/人工智能/" | relative_url }}">人工智能</a>
        <a href="{{ "/category/网络安全/" | relative_url }}">网络安全</a>
        <a href="{{ "/category/小记/" | relative_url }}">小记</a>
        <a href="{{ "/archive.html" | relative_url }}">归档</a>
    </div>
    <button id="theme-toggle" style="background: transparent; border: 1px solid var(--neon-color); color: var(--neon-color); padding: 0.5rem 1.2rem; border-radius: 4px; cursor: pointer; font-family: inherit; transition: all 0.3s ease; white-space: nowrap;">
        🌓 切换背景
    </button>
</nav>

  <main>
    {{ content }}
  </main>

  <footer style="margin-top: 3rem; text-align: center; color: var(--sub-text);">
    <p>&copy; {{ site.time | date: "%Y" }} {{ site.author }} | 我的博客</p>
  </footer>

  <script src="{{ "/assets/js/particles.min.js" | relative_url }}"></script>
  
  <script>
    const themeToggleBtn = document.getElementById('theme-toggle');
    const htmlElement = document.documentElement;

    // 封装一个函数：根据不同主题加载不同颜色的粒子
    function loadParticles(theme) {
      const isLight = theme === 'light';
      const pColor = isLight ? '#0066ff' : '#00f5ff'; // 明亮用深蓝，暗黑用霓虹青
      const pOpacity = isLight ? 0.3 : 0.4;

      particlesJS("particles-js", {
        "particles": {
          "number": { "value": 60, "density": { "enable": true, "value_area": 800 } },
          "color": { "value": pColor },
          "shape": { "type": "circle" },
          "opacity": { "value": pOpacity, "random": false },
          "size": { "value": 3, "random": true },
          "line_linked": {
            "enable": true, "distance": 150, "color": pColor,
            "opacity": pOpacity, "width": 1
          },
          "move": { "enable": true, "speed": 1.5, "direction": "none", "random": true, "out_mode": "out" }
        },
        "interactivity": {
          "detect_on": "canvas",
          "events": {
            "onhover": { "enable": true, "mode": "grab" }, // 鼠标悬浮抓取连线
            "onclick": { "enable": true, "mode": "push" }, // 鼠标点击爆发新粒子
            "resize": true
          },
          "modes": {
            "grab": { "distance": 180, "line_linked": { "opacity": 0.8 } },
            "push": { "particles_nb": 3 }
          }
        },
        "retina_detect": true
      });
    }

    // 1. 页面加载时：检测本地主题，并启动对应粒子
    const savedTheme = localStorage.getItem('blog-theme') || 'dark';
    if (savedTheme === 'light') {
      htmlElement.setAttribute('data-theme', 'light');
    }
    loadParticles(savedTheme);

    // 2. 点击按钮时：切换主题并重绘粒子
    themeToggleBtn.addEventListener('click', () => {
      const currentTheme = htmlElement.getAttribute('data-theme');
      let newTheme = 'dark';

      if (currentTheme === 'light') {
        htmlElement.removeAttribute('data-theme');
        localStorage.setItem('blog-theme', 'dark');
      } else {
        htmlElement.setAttribute('data-theme', 'light');
        localStorage.setItem('blog-theme', 'light');
        newTheme = 'light';
      }
      
      // 销毁旧粒子并加载新颜色粒子
      loadParticles(newTheme);
    });
  </script>

  <script>
    // 代码块复制按钮
    document.querySelectorAll('.post-content pre').forEach(block => {
      const copyBtn = document.createElement('button');
      copyBtn.className = 'copy-btn';
      copyBtn.textContent = '复制';
      copyBtn.addEventListener('click', () => {
        const code = block.querySelector('code');
        const text = code ? code.innerText : block.innerText;
        navigator.clipboard.writeText(text).then(() => {
          copyBtn.textContent = '已复制';
          setTimeout(() => { copyBtn.textContent = '复制'; }, 1200);
        });
      });
      block.appendChild(copyBtn);
    });
  </script>
</body>
</html>
